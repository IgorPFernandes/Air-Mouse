; Remote Mouse - Air Mouse BLE com ESP32-C3 + MPU6050
; Combinacao de versoes fixada de proposito: arduino-esp32 2.0.17 + NimBLE 1.4.3
; e a mais testada para BLE HID no ESP32-C3. Nao atualize sem testar.

[env:esp32-c3]
platform      = espressif32@6.9.0
board         = esp32-c3-devkitm-1
framework     = arduino
monitor_speed = 115200
upload_speed  = 921600

lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.3

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D CORE_DEBUG_LEVEL=0

; Se a sua placa e a "ESP32-C3 SuperMini" e o upload falhar,
; segure BOOT, toque RESET, solte BOOT e mande o upload de novo.
